<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LDR Luxury Suite: Eternal Canvas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone untuk compile JSX di Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    .animate-pulse-glow { animation: pulse-glow 4s infinite ease-in-out; }
    .glass-card {
      background: rgba(28, 37, 65, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(224, 169, 109, 0.25);
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF3E4 0%, #E0A96D 50%, #C58B4E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-[#0B132B] text-slate-100 font-sans min-h-screen overflow-x-hidden relative selection:bg-[#E0A96D] selection:text-[#0B132B]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper Komponen Icon Lucide
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className} ref={iconRef}></i>;
    };

    function App() {
      // Status Navigasi Utama
      const [activeTab, setActiveTab] = useState('hub');
      
      // Status Ruang Suara & Suasana
      const [isInCall, setIsInCall] = useState(true);
      const [isMuted, setIsMuted] = useState(false);
      const [callDuration, setCallDuration] = useState(1482); 
      const [selectedAmbiance, setSelectedAmbiance] = useState('Crain');
      const [isPlayingAmbiance, setIsPlayingAmbiance] = useState(false);
      const [ambianceVolume, setAmbianceVolume] = useState(60);

      // Status Mood
      const [myMood, setMyMood] = useState('Rindu Berat');
      const [partnerMood, setPartnerMood] = useState('Butuh Pelukan');

      // Timer Panggilan
      useEffect(() => {
        let interval = null;
        if (isInCall) {
          interval = setInterval(() => {
            setCallDuration((prev) => prev + 1);
          }, 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isInCall]);

      const formatCallTime = (totalSec) => {
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        if (hrs > 0) {
          return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      // Efek Partikel Pelukan
      const [hugParticles, setHugParticles] = useState([]);
      const triggerHug = () => {
        const newParticles = Array.from({ length: 24 }).map((_, i) => ({
          id: Date.now() + i,
          x: 50 + (Math.random() * 60 - 30),
          y: 50 + (Math.random() * 60 - 30),
          size: Math.random() * 28 + 18,
          angle: Math.random() * 360,
        }));
        setHugParticles((prev) => [...prev, ...newParticles]);
        setTimeout(() => {
          setHugParticles([]);
        }, 2500);
      };

      // Mini Games Pasangan
      const [gameTab, setGameTab] = useState('cards');
      const [cardCategory, setCardCategory] = useState('Masa Depan');
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [savedFavorites, setSavedFavorites] = useState(['Jika kita bisa membangun rumah impian di mana saja di dunia, di kota mana kita akan tinggal?']);

      const cardsData = {
        "Icebreaker": [
          "Apa hal pertama yang paling menarik perhatianmu saat kita pertama kali kenal?",
          "Jika kamu bisa teleportasi ke tempatku selama 10 menit sekarang, apa hal pertama yang ingin kamu lakukan?",
          "Lagu apa yang paling membuatmu langsung teringat padaku?",
          "Foto mana dari kebersamaan kita yang paling kamu favoritkan?"
        ],
        "Masa Depan": [
          "Jika kita bisa membangun rumah impian di mana saja di dunia, di kota mana kita akan tinggal?",
          "Apa satu target hubungan yang paling ingin kita capai bersama dalam 3 tahun ke depan?",
          "Bagaimana gambaran hari idealmu ketika kita sudah tinggal satu rumah nanti?",
          "Apa kekhawatiran terbesar mengenai LDR yang ini yang belum pernah kamu ungkapkan?"
        ],
        "Kerinduan": [
          "Saat paling merindukanku, apa hal yang paling sering kamu lakukan untuk mengobatinya?",
          "Kebiasaan kecil apa dariku yang paling kamu rindukan saat kita saling berjauhan?",
          "Ingatkah kamu momen saat pertama kali kita berpelukan erat? Bagaimana perasaanmu waktu itu?",
          "Apa kata-kata penyemangat dariku yang paling membekas di hatimu?"
        ],
        "Kenangan Indah": [
          "Momen mana yang membuatmu yakin bahwa aku adalah orang yang tepat untukmu?",
          "Apa kejadian paling lucu atau konyol saat kita sedang kencan online?",
          "Tempat makan atau nongkrong mana yang paling ingin kamu kunjungi kembali bersamaku?",
          "Impian sederhana apa tentang kita yang paling sering kamu bayangkan sebelum tidur?"
        ]
      };

      const currentCards = cardsData[cardCategory] || cardsData['Masa Depan'];
      const currentCardText = currentCards[currentCardIndex % currentCards.length];

      const handleNextCard = () => {
        setIsFlipped(false);
        setTimeout(() => {
          setCurrentCardIndex((prev) => prev + 1);
        }, 150);
      };

      const toggleFavoriteCard = () => {
        if (savedFavorites.includes(currentCardText)) {
          setSavedFavorites(savedFavorites.filter((item) => item !== currentCardText));
        } else {
          setSavedFavorites([...savedFavorites, currentCardText]);
        }
      };

      // Co-Op Canvas
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [currentColor, setCurrentColor] = useState('#E0A96D');
      const [brushSize, setBrushSize] = useState(4);
      const [notes, setNotes] = useState([
        { id: 1, x: 15, y: 25, text: "Selalu mikirin kamu! ❤️", color: "bg-rose-900/60 border-rose-500/40" },
        { id: 2, x: 65, y: 60, text: "Nggak sabar buat liburan bareng! ✈️", color: "bg-amber-900/60 border-amber-500/40" }
      ]);
      const [newNoteText, setNewNoteText] = useState('');

      useEffect(() => {
        if (gameTab === 'canvas' && canvasRef.current) {
          const canvas = canvasRef.current;
          canvas.refCurrent;
          const ctx = canvas.getContext('2d');
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        }
      }, [gameTab]);

      const startDrawing = (e) => {
        if (!canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const ctx = canvasRef.current.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing || !canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const ctx = canvasRef.current.getContext('2d');
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = brushSize;
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
      };

      const stopDrawing = () => {
        setIsDrawing(false);
      };

      const clearCanvas = () => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');
        ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
      };

      const addStickyNote = () => {
        if (!newNoteText.trim()) return;
        setNotes([...notes, {
          id: Date.now(),
          x: Math.floor(Math.random() * 50) + 10,
          y: Math.floor(Math.random() * 50) + 10,
          text: newNoteText,
          color: "bg-indigo-900/60 border-indigo-500/40"
        }]);
        setNewNoteText('');
      };

      // Kuis Pasangan
      const quizQuestions = [
        {
          question: "Di mana pasanganmu paling ingin merayakan ulang tahun pernikahan kalian nanti?",
          options: ["Restoran Romantis Atas Gedung (Rooftop)", "Kabin Nyaman di Pegunungan", "Villa Pinggir Pantai Privat", "Kapal Pesiar Mewah"],
          partnerAnswer: 0
        },
        {
          question: "Apa makanan penenang (comfort food) favorit pasanganmu setelah seharian lelah?",
          options: ["Ramen Hangat & Dimsum", "Pizza Artisanal & Minuman Dingin", "Dessert Cokelat Mewah", "Burger Daging Spesial"],
          partnerAnswer: 1
        },
        {
          question: "Destinasi impian nomor 1 yang paling ingin dikunjungi pasanganmu bersama?",
          options: ["Melihat Aurora di Iglo Kaca (Finlandia)", "Bungalow Atas Air di Bora Bora", "Kereta Mewah Melintasi Pegunungan Swiss", "Malam Opera & Naik Gondola di Venesia"],
          partnerAnswer: 1
        }
      ];

      const [quizIndex, setQuizIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [quizScore, setQuizScore] = useState(0);

      const handleAnswerSelect = (optionIdx) => {
        if (userAnswers[quizIndex] !== undefined) return;
        const isCorrect = optionIdx === quizQuestions[quizIndex].partnerAnswer;
        setUserAnswers({ ...userAnswers, [quizIndex]: optionIdx });
        if (isCorrect) setQuizScore(prev => prev + 1);
      };

      // Dual Time & Countdown Tracker
      const [partnerCity, setPartnerCity] = useState('Tokyo');
      const [partnerOffset, setPartnerOffset] = useState(2);
      const [userTime, setUserTime] = useState(new Date());
      const [partnerTime, setPartnerTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => {
          const now = new Date();
          setUserTime(now);
          const partnerDate = new Date(now.getTime() + partnerOffset * 3600000);
          setPartnerTime(partnerDate);
        }, 1000);
        return () => clearInterval(timer);
      }, [partnerOffset]);

      const targetMeetupDate = new Date(2026, 11, 24); 
      const diffTime = Math.max(0, targetMeetupDate - userTime);
      const daysLeft = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const hoursLeft = Math.floor((diffTime / (1000 * 60 * 60)) % 24);
      const minsLeft = Math.floor((diffTime / (1000 * 60)) % 60);
      const secsLeft = Math.floor((diffTime / 1000) % 60);

      // Perencana Kencan Virtual
      const [schedule, setSchedule] = useState([
        { id: 1, title: 'Menatap Bintang & Listening Party Jazz Malam', time: 'Besok, 21:00 WIB', desc: 'Streaming langsung tayangan Observatorium 4K disinkronkan dengan daftar lagu Jazz favorit.', tag: 'Romantis', icon: 'sparkles' },
        { id: 2, title: 'Kencan Melukis & Minum Teh Bersama', time: 'Sabtu, 19:30 WIB', desc: 'Sama-sama menyeduh teh favorit, menggambar live di Dual Canvas diiringi lagu akustik.', tag: 'Kreatif', icon: 'feather' }
      ]);
      const [presetDates] = useState([
        { title: 'Menatap Bintang & Musik Jazz', desc: 'Streaming langsung tayangan Observatorium 4K disinkronkan dengan daftar lagu Jazz.', tag: 'Romantis', icon: 'sparkles' },
        { title: 'Kencan Melukis & Minum Teh', desc: 'Sama-sama menyeduh teh favorit, menggambar live di Dual Canvas diiringi lagu akustik.', tag: 'Kreatif', icon: 'feather' },
        { title: 'Memasak Memorable Dinner', desc: 'Memasak resep pasta spesial bersama-sama via panggilan video resolusi tinggi.', tag: 'Kuliner', icon: 'flame' },
        { title: 'Bioskop Privat Virtual', desc: 'Streaming film pilihan disinkronkan secara presisi dengan ruang percakapan suara terbuka.', tag: 'Hiburan', icon: 'globe' }
      ]);

      const handleAddPresetDate = (preset) => {
        setSchedule([...schedule, { id: Date.now(), title: preset.title, time: 'Dijadwalkan untuk Pertemuan Berikutnya', desc: preset.desc, tag: preset.tag, icon: preset.icon }]);
      };

      // Brankas Surat Cinta Digital (Love Vault)
      const [letters, setLetters] = useState([
        { id: 1, title: 'Buka Saat Kamu Sangat Merindukanku', unlocked: true, unlockDate: 'Terbuka Hari Ini', content: 'Sayangku, jarak hanyalah ujian geografis seberapa jauh cinta kita bisa berlabuh. Setiap detik yang berlalu membawa kita lebih dekat ke kota yang sama secara permanen. Dekap erat pesan ini hari ini ya.', waxColor: 'from-amber-600 to-yellow-500' },
        { id: 2, title: 'Buka Pada Pagi Hari 5 Hari Saat Pertemuan Tiba', unlocked: false, unlockDate: 'Terbuka dalam 14 Hari', content: 'Selamat pagi jiwaku! Saat kamu membaca ini, penerbanganku sudah mendarat dan kita akan berdiri di bawah langit yang sama lagi. Aku menjemputmu di pintu kedatangan dengan senyuman terbaik.', waxColor: 'from-rose-600 to-pink-500' },
        { id: 3, title: 'Buka Pada Ulang Tahun Hubungan Kita', unlocked: false, unlockDate: 'Terbuka 24 Nov 2026', content: 'Dua tahun penuh kenangan luar biasa, pesan suara di larut malam, dan impian yang kita bangun bersama. Terima kasih telah menjadi jangkar ketenangan dalam hidupku.', waxColor: 'from-indigo-600 to-purple-500' }
      ]);
      const [openedLetter, setOpenedLetter] = useState(null);
      const [newLetterTitle, setNewLetterTitle] = useState('');
      const [newLetterContent, setNewLetterContent] = useState('');
      const [showLetterModal, setShowLetterModal] = useState(false);

      const handleCreateLetter = () => {
        if (!newLetterTitle || !newLetterContent) return;
        setLetters([...letters, { id: Date.now(), title: newLetterTitle, unlocked: false, unlockDate: 'Terkunci (Ditentukan Nanti)', content: newLetterContent, waxColor: 'from-amber-500 to-rose-500' }]);
        setNewLetterTitle(''); setNewLetterContent(''); setShowLetterModal(false);
      };

      return (
        <div class="min-h-screen bg-[#0B132B] text-slate-100 flex flex-col justify-between">
          
          {/* Visualizer Partikel Pelukan */}
          {hugParticles.length > 0 && (
            <div class="fixed inset-0 pointer-events-none z-50 overflow-hidden">
              {hugParticles.map((p) => (
                <div
                  key={p.id}
                  class="absolute text-rose-500 opacity-90 animate-bounce transition-all duration-1000"
                  style={{
                    left: `${p.x}%`,
                    top: `${p.y}%`,
                    transform: `rotate(${p.angle}deg)`,
                    fontSize: `${p.size}px`
                  }}
                >
                  ❤️
                </div>
              ))}
            </div>
          )}

          {/* Header & Navigasi */}
          <header class="sticky top-0 z-40 glass-card border-b border-amber-500/20 px-6 py-4 shadow-2xl">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 p-[2px] shadow-lg shadow-amber-500/20">
                  <div class="w-full h-full bg-[#0B132B] rounded-full flex items-center justify-center">
                    <Icon name="heart" class="w-5 h-5 text-amber-400 fill-amber-400/20" />
                  </div>
                </div>
                <div>
                  <h1 class="text-xl font-bold tracking-wide gold-gradient-text">Elysium LDR</h1>
                  <p class="text-xs text-amber-200/60 tracking-widest uppercase font-mono">Luxury Connection Suite</p>
                </div>
              </div>

              {/* Status Bar Cepat & Tombol Pelukan */}
              <div class="flex items-center gap-4 bg-[#1C2541]/80 px-4 py-2 rounded-full border border-amber-500/30">
                <div class="flex items-center gap-2 border-r border-slate-700 pr-4">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                  <span class="text-xs text-emerald-300 font-mono">Terhubung (HD Audio)</span>
                </div>
                <button
                  onClick={triggerHug}
                  class="flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full bg-gradient-to-r from-rose-500 to-amber-600 hover:from-rose-600 hover:to-amber-700 text-white shadow-lg transition duration-300 active:scale-95"
                >
                  <Icon name="heart" class="w-4 h-4 fill-white" />
                  <span>Kirim Pelukan Instan</span>
                </button>
              </div>

              {/* Tab Navigation */}
              <nav class="flex items-center gap-1 bg-[#0B132B]/60 p-1.5 rounded-xl border border-slate-800">
                {[
                  { id: 'hub', label: 'Ruang Suara', icon: 'mic' },
                  { id: 'games', label: 'Mini-Games', icon: 'gamepad-2' },
                  { id: 'time', label: 'Hitung Mundur', icon: 'clock' },
                  { id: 'vault', label: 'Surat & Kencan', icon: 'lock' }
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    class={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all duration-300 ${
                      activeTab === tab.id
                        ? 'bg-gradient-to-r from-amber-500/20 to-rose-500/20 text-amber-300 border border-amber-500/40 shadow-inner'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'
                    }`}
                  >
                    <Icon name={tab.icon} class="w-4 h-4" />
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Konten Utama */}
          <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1">
            
            {/* TAB 1: RUANG SUARA & SUASANA */}
            {activeTab === 'hub' && (
              <div class="space-y-8 animate-fadeIn">
                {/* Visualizer Suara Utama */}
                <div class="glass-card rounded-3xl p-8 relative overflow-hidden shadow-2xl">
                  <div class="absolute -top-24 -right-24 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
                  <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>

                  <div class="flex flex-col md:flex-row items-center justify-between gap-8 relative z-10">
                    {/* Sisi User */}
                    <div class="flex flex-col items-center text-center space-y-3">
                      <div class="relative">
                        <div class={`w-28 h-28 rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 p-1 ${isInCall && !isMuted ? 'animate-pulse-glow' : ''}`}>
                          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80" alt="Avatar Anda" class="w-full h-full object-cover rounded-full" />
                        </div>
                        <span class="ab
